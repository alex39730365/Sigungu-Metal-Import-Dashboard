name: Build DART Metal Index

on:
  # 수동 실행 (Actions 탭에서 Run workflow)
  workflow_dispatch:
  # 매월 1일 09:00 KST (UTC 기준 24일)
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Build DART metal index
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          cd dashboard/backend
          python build_dart_metal_index.py

      - name: Commit and push updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/backend/dart_metal_index.json
          if ! git diff --cached --quiet; then
            git commit -m "Update dart_metal_index.json via GitHub Actions [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
