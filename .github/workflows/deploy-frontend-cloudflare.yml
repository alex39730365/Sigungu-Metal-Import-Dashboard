name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/frontend/**"
      - ".github/workflows/deploy-frontend-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Set VITE_API_BASE_URL
        id: api_url
        run: |
          API_URL="${{ secrets.VITE_API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://sigungu-metal-dashboard-api.onrender.com"
            echo "⚠️ VITE_API_BASE_URL secret is not set. Falling back to $API_URL"
            echo "If your backend is at a different URL, set the VITE_API_BASE_URL GitHub secret."
          fi
          echo "VITE_API_BASE_URL=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Install and build frontend
        env:
          VITE_API_BASE_URL: ${{ steps.api_url.outputs.VITE_API_BASE_URL }}
          CI: "true"
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_ALLOW_SCRIPTS: "true"
        run: |
          cd dashboard/frontend
          npm install --no-audit --no-fund
          npm run build

      - name: Deploy to Cloudflare Pages
        timeout-minutes: 15
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sigungu-metal-dashboard
          directory: dashboard/frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
